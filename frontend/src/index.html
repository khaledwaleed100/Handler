<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <title>The Handler</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="The Handler: your 5-a-side group's matches, fair teams and honest ratings.">
  <meta name="theme-color" content="#0b1220">
  <meta name="color-scheme" content="dark light">

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="The Handler">
  <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

  <!-- Apply saved theme and language before first paint (no flash). -->
  <script src="boot.js"></script>
  <style>
    /* Splash shown until the app starts. On a sleeping free server this can take a while. */
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
              background: #0b1220; color: #94a3b8; font: 600 14px system-ui, sans-serif; text-align: center; padding: 24px; }
    html:not(.dark) #splash { background: #f4fbf6; color: #4d6b5a; }
    #splash .logo { position: relative; width: 76px; height: 76px; }
    #splash .logo img { position: relative; z-index: 1; border-radius: 20px; animation: breathe 1.6s ease-in-out infinite; }
    #splash .logo::before, #splash .logo::after { content: ''; position: absolute; inset: 0; border-radius: 22px;
              border: 2px solid #22c55e; opacity: 0; animation: ripple 2.4s ease-out infinite; }
    #splash .logo::after { animation-delay: 1.2s; }
    #splash .bar { width: 120px; height: 3px; border-radius: 3px; overflow: hidden; background: rgba(148,163,184,.2);
              opacity: 0; animation: show .4s 1.2s forwards; }
    #splash .bar span { display: block; width: 40%; height: 100%; border-radius: 3px; background: #22c55e; animation: slide 1.1s ease-in-out infinite; }
    #splash-text { min-height: 20px; opacity: 0; transition: opacity .4s; }
    #splash-text.on { opacity: 1; }
    @keyframes breathe { 50% { transform: scale(1.06); } }
    @keyframes ripple { 0% { opacity: .6; transform: scale(1); } 100% { opacity: 0; transform: scale(1.7); } }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @keyframes show { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { #splash *, #splash *::before, #splash *::after { animation: none !important; } #splash .bar { opacity: 1; } }
    app-root:not(:empty) + #splash { display: none; }
  </style>
</head>
<body>
  <app-root></app-root>
  <div id="splash" aria-hidden="true">
    <div class="logo"><img src="assets/icons/icon-96x96.png" width="76" height="76" alt=""></div>
    <div class="bar"><span></span></div>
    <div id="splash-text"></div>
  </div>
  <noscript>Please enable JavaScript to use this app.</noscript>
</body>
</html>
